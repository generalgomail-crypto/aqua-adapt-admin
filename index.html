<script>
'use strict';
const STORAGE_KEY='smartWaterDistribution_v2';
const LEGACY_STORAGE_KEY='smartWaterDistribution_v1';
const DAY_NAMES=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const PAGE_META={requests:['طلبات تسجيل الأسر','مراجعة طلبات التسجيل والموافقة عليها أو رفضها'],dashboard:['لوحة التحكم','ملخص توزيع المياه ومؤشرات التشغيل'],areas:['إدارة المناطق','بيانات المنطقة والسكان والتضاريس ومصدر المياه'],households:['الأسر والوحدات','إدارة السكان والحصص والخزانات'],schedule:['جدول التعبئة','توزيع أحمال التعبئة خلال أيام الأسبوع'],network:['الشبكة والحسابات','إعدادات الشبكة وحسابات هيدروليكية أولية'],quality:['جودة المياه','سجل قراءات العكارة للخط الرئيسي والخزانات'],loss:['التدفق والفواقد','مطابقة المياه الداخلة مع الكميات المسجلة'],reports:['التقارير والنسخ الاحتياطي','تصدير البيانات واستعادتها'],settings:['الإعدادات','الافتراضات التشغيلية وحدود التنبيه']};
const PORTAL_MODE='admin';
let state, currentView='dashboard', currentRole=(PORTAL_MODE==='admin'?'admin':'family'), familySessionId=null, householdSearch='', householdFilter='all', adminUnlocked=false, currentAdminUser=null;
const fmt=(n,d=0)=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const num=(v,def=0)=>{const x=Number(v);return Number.isFinite(x)?x:def};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const parseISO=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(date,n)=>{const d=new Date(date);d.setDate(d.getDate()+n);return d};
const isoDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dateLabel=s=>s?parseISO(s).toLocaleDateString('ar-PS',{day:'numeric',month:'short',year:'numeric'}):'—';
function weeklyQuota(members){return Math.max(0,members)*state.settings.litresPerPersonDay*7}
function tankFor(quota){const sizes=[500,750,1000,1500,2000,3000,5000];return sizes.find(x=>x>=quota)||5000}
function fillParts(quota,cap){const parts=[];let rem=quota;while(rem>0.001){const part=Math.min(cap,rem);parts.push(Math.round(part*10)/10);rem-=part;if(parts.length>100)break}return parts}
function generateAccessCode(existing=[]){
  const used=new Set(existing.map(String));
  let code='';
  do {
    if(window.crypto?.getRandomValues){const a=new Uint32Array(1);window.crypto.getRandomValues(a);code=String(10000000+(a[0]%90000000));}
    else code=String(Math.floor(10000000+Math.random()*90000000));
  } while(used.has(code));
  return code;
}
function ensureAccessCodes(households){
  const used=new Set();
  households.forEach(h=>{
    let code=String(h.accessCode||'');
    if(!/^\d{8}$/.test(code)||used.has(code)) code=generateAccessCode([...used]);
    h.accessCode=code; used.add(code);
  });
}
function defaultState(){
  const settings={litresPerPersonDay:45,zoneCount:10,mainLength:1000,pumpHours:8,targetVelocity:1.2,maxHeadloss:10,roughnessMm:0.0015,turbidityLimit:5,fillDurationHours:2,serviceDiameterMm:25,mainDiameterMm:0,branchDiameterMm:0,branchLengths:Array(10).fill(50),networkElevationM:0,sourceDailyCapacity:50000,weekStart:isoDate(addDays(new Date(),-new Date().getDay()))};
  const households=[];
  for(let i=1;i<=90;i++) households.push({id:`H${String(i).padStart(3,'0')}`,familyNo:`FAM-${String(i).padStart(5,'0')}`,name:`الأسرة ${String(i).padStart(3,'0')}`,members:5,zone:Math.ceil(i/9),housingType:'house',building:'',unit:'',serviceLength:20,active:true,valveState:'closed',accessCode:generateAccessCode(households.map(x=>x.accessCode)),accountStatus:'demo'});
  const s={settings,households,areas:[],registrationRequests:[],schedule:[],fillHistory:[],qualityReadings:[],flowReadings:[],pressureReadings:[],adminAuth:null,adminUsers:[],meta:{createdAt:new Date().toISOString(),lastScheduleBuild:null}};
  s.schedule=buildScheduleFor(s.households,s.settings,s.settings.weekStart);
  s.meta.lastScheduleBuild=new Date().toISOString();
  return s;
}
function buildScheduleFor(households,settings,weekStart){
  const loads=Array(7).fill(0),counts=Array(7).fill(0),events=[],usedDays=new Map();
  const capacity=Math.max(0,num(settings.sourceDailyCapacity,0));
  for(const h of households.filter(x=>x.active!==false)){
    const q=Math.round(Math.max(0,num(h.members,0))*num(settings.litresPerPersonDay,45)*7*10)/10;

async function submitRegistrationRequest(e){
 e.preventDefault();const f=new FormData(e.currentTarget);const name=String(f.get('name')||'').trim(),location=String(f.get('location')||'').trim(),phoneRaw=String(f.get('phone')||'').trim(),phone=normalizePhone(phoneRaw);const members=Math.round(num(f.get('members'),0));const houseAreaM2=Math.round(num(f.get('houseAreaM2'),0)*10)/10;const floors=Math.round(num(f.get('floors'),0));const password=String(f.get('password')||''),confirmPassword=String(f.get('confirmPassword')||'');
 if(!name||!location||members<1||members>100){toast('تحقق من الاسم والعنوان وعدد الأفراد (1 إلى 100).');return;}
 if(!Number.isFinite(houseAreaM2)||houseAreaM2<1||houseAreaM2>50000){toast('أدخل مساحة صحيحة بين 1 و50000 متر مربع.');return;}
 if(!Number.isInteger(floors)||floors<1||floors>100){toast('أدخل عدد طوابق صحيحًا بين 1 و100.');return;}
 if(!phone){toast('أدخل رقم هاتف صحيحًا من 8 إلى 15 رقمًا، مع رمز الدولة إن أمكن.');return;}
 const phoneInUse=(state.households||[]).some(h=>normalizePhone(h.phone)===phone)||(state.registrationRequests||[]).some(r=>normalizePhone(r.phone)===phone&&['pending','approved'].includes(r.status));
 if(phoneInUse){toast('رقم الهاتف مرتبط بطلب أو حساب موجود بالفعل. استخدم الرقم المسجّل أو تواصل مع المسؤول.');return;}
 if(password.length<8){toast('كلمة المرور يجب ألا تقل عن 8 أحرف.');return;}
 if(password!==confirmPassword){toast('كلمتا المرور غير متطابقتين.');return;}
 const submit=e.currentTarget.querySelector('button[type="submit"]');submit.disabled=true;submit.textContent='جارٍ تجهيز الطلب…';
 try{const familyNo=nextFamilyNumber(),salt=randomSalt(),digest=await passwordDigest(password,salt);const req={id:`REQ-${Date.now().toString(36).toUpperCase()}`,familyNo,name,phone:phoneRaw,members,houseAreaM2,floors,zone:1,housingType:String(f.get('housingType')||'house'),building:String(f.get('building')||'').trim(),unit:String(f.get('unit')||'').trim(),location,passwordSalt:salt,passwordHash:digest,status:'pending',createdAt:new Date().toISOString()};state.registrationRequests.push(req);if(!saveState())throw new Error('تعذر حفظ طلب التسجيل. حاول فتح الملف في متصفح يسمح بالتخزين المحلي.');renderFamilyLogin('register',`<strong>تم إرسال طلب التسجيل بنجاح.</strong><div class="metric-line"><span>اسم الأسرة المسجّل</span><b>${esc(name)}</b></div><div class="metric-line"><span>رقم الهاتف المسجّل</span><b dir="ltr">${esc(phoneRaw)}</b></div><div class="metric-line"><span>عدد أفراد الأسرة</span><b>${fmt(members)} أفراد</b></div><div class="metric-line"><span>مساحة المنزل / الشقة</span><b>${fmt(houseAreaM2)} م²</b></div><div class="metric-line"><span>عدد الطوابق</span><b>${fmt(floors)}</b></div><div class="card" style="margin:12px 0;padding:14px;text-align:center;background:var(--surface-2, #f4f7f9)"><div class="tiny">رقم الأسرة الذي أنشأه النظام</div><div id="issuedFamilyNo" style="font-size:24px;font-weight:800;letter-spacing:1px;margin:8px 0">${esc(familyNo)}</div><button class="btn small" type="button" onclick="copyFamilyNumber('${esc(familyNo)}')">نسخ رقم الأسرة</button></div><div class="notice warn"><span>⏳</span><div>الحالة: <strong>بانتظار موافقة المسؤول</strong><br>بعد موافقة المسؤول سيظهر إشعار قبول يتضمن اسم الأسرة ورقم الحساب. احتفظ بكلمة المرور التي اخترتها؛ لن يرسلها النظام في أي إشعار.</div></div>`);/* لا نعرض إشعار قبول عند إرسال الطلب؛ الطلب يبقى بانتظار مراجعة المسؤول. */toast('وصل الطلب إلى قائمة مراجعة المسؤول على هذا الجهاز.');}
 catch(err){console.error(err);toast(err?.message||'تعذر إنشاء الطلب.');submit.disabled=false;submit.textContent='إرسال طلب التسجيل للمسؤول';}
}

function copyFamilyNumber(value){
 const text=String(value||'').trim();
 if(!text)return;
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>toast('تم نسخ رقم الأسرة.')).catch(()=>fallbackCopyFamilyNumber(text));}
 else fallbackCopyFamilyNumber(text);
}
function fallbackCopyFamilyNumber(text){
 const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();
 try{const ok=document.execCommand('copy');toast(ok?'تم نسخ رقم الأسرة.':'تعذر النسخ؛ يمكنك تحديد الرقم ونسخه يدويًا.');}
 catch(_){toast('تعذر النسخ؛ يمكنك تحديد الرقم ونسخه يدويًا.');}
 finally{area.remove();}
}

function normalizePhone(value){
 const raw=String(value||'').trim().replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).replace(/[۰-۹]/g,d=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)));
 let digits=raw.replace(/\D/g,'');
 if(digits.startsWith('00'))digits=digits.slice(2);
 return digits.length>=8&&digits.length<=15?digits:'';
}
async function handleFamilyLogin(e){
 e.preventDefault();
 const f=new FormData(e.currentTarget),phoneRaw=String(f.get('phone')||''),phone=normalizePhone(phoneRaw),password=String(f.get('password')||'');
 if(!phone){toast('أدخل رقم هاتف صحيحًا من 8 إلى 15 رقمًا.');return;}
 if(!password){toast('أدخل كلمة المرور.');return;}
 const candidates=state.households.filter(x=>x.accountStatus==='active'&&normalizePhone(x.phone)===phone);
 try{
  const matches=[];
  for(const h of candidates){const digest=await passwordDigest(password,h.passwordSalt||'');if(digest===h.passwordHash)matches.push(h);}
  if(matches.length===1){familySessionId=matches[0].id;renderAll();toast('تم تسجيل الدخول بنجاح.');return;}
  if(matches.length>1){toast('هذا الرقم مرتبط بأكثر من حساب. تواصل مع مسؤول الشبكة لتصحيح البيانات.');return;}
  const requests=(state.registrationRequests||[]).filter(r=>normalizePhone(r.phone)===phone);
  const pending=requests.some(r=>r.status==='pending');
  const rejected=requests.some(r=>r.status==='rejected');
  if(pending){toast('طلب التسجيل بهذا الرقم ما زال بانتظار موافقة المسؤول.');return;}
  if(rejected){toast('تم رفض طلب التسجيل. تواصل مع مسؤول الشبكة.');return;}
  toast(candidates.length?'كلمة المرور غير صحيحة.':'لم نجد حسابًا مرتبطًا بهذا الرقم. تحقق من رقم الهاتف.');
 }catch(err){console.error(err);toast(err?.message||'تعذر التحقق من بيانات الدخول.');}
}

function renderAlerts(){const a=[];const peak=dailyMax();if(peak>state.settings.sourceDailyCapacity&&state.settings.sourceDailyCapacity>0)a.push(['red','حمل يومي يتجاوز سعة الإمداد المدخلة',`الذروة ${fmt(peak)} لتر مقابل سعة ${fmt(state.settings.sourceDailyCapacity)} لتر/يوم.`]);if(!state.qualityReadings.length)a.push(['amber','لم تُسجل قراءات عكارة بعد','أدخل قراءة من الخط الرئيسي أو أحد الخزانات.']);if(!state.flowReadings.length)a.push(['amber','لا توجد قراءات عداد مصدر','سجّل كمية المياه الداخلة لمقارنة الفاقد الظاهري.']);const high=state.qualityReadings.filter(r=>r.ntu>state.settings.turbidityLimit).length;if(high)a.push(['red',`${high} قراءة عكارة تجاوزت حد التنبيه`, 'أوقف الاعتماد على القراءة وحدها واطلب فحصًا مختبريًا وإجراءً تشغيليًا مناسبًا.']);if(!a.length)a.push(['green','لا توجد تنبيهات مسجلة','تابع إدخال القراءات ومطابقة البيانات.']);return a.map(x=>`<div style="display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)"><span class="pill ${x[0]}">●</span><div><b style="font-size:11px">${x[1]}</b><div class="tiny">${x[2]}</div></div></div>`).join('')}

function drawChart(id,days){const c=document.getElementById(id);if(!c)return;const ctx=c.getContext('2d');const w=c.clientWidth||600,h=c.clientHeight||225,dpr=window.devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);const max=Math.max(1,...days.map(x=>x.volume))*1.15;const left=34,right=10,top=12,bottom=34;const cw=w-left-right,ch=h-top-bottom;ctx.strokeStyle='#e8edf3';ctx.lineWidth=1;ctx.fillStyle='#8b98aa';ctx.font='10px Tahoma';ctx.textAlign='right';for(let i=0;i<=4;i++){const y=top+ch*i/4;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-right,y);ctx.stroke();ctx.fillText((max*(1-i/4)/1000).toFixed(1),left-7,y+3)}const bw=Math.min(36,cw/10);days.forEach((d,i)=>{const x=left+(i+.5)*cw/7-bw/2;const bh=d.volume/max*ch;ctx.fillStyle=d.day===new Date().getDay()?'#0caebb':'#5b91d8';ctx.beginPath();ctx.roundRect(x,top+ch-bh,bw,bh,5);ctx.fill();ctx.fillStyle='#68788d';ctx.textAlign='center';ctx.fillText(DAY_NAMES[d.day],x+bw/2,h-12);});}

function saveNetworkForm(e){e.preventDefault();const f=new FormData(e.currentTarget),old=state.settings.zoneCount,newN=Math.max(1,Math.min(100,Math.round(num(f.get('zoneCount'),old))));Object.assign(state.settings,{mainLength:Math.max(1,num(f.get('mainLength'),1000)),zoneCount:newN,pumpHours:Math.max(.5,num(f.get('pumpHours'),8)),targetVelocity:Math.max(.3,num(f.get('targetVelocity'),1.2)),maxHeadloss:Math.max(1,num(f.get('maxHeadloss'),10)),roughnessMm:Math.max(.0001,num(f.get('roughnessMm'),.0015)),networkElevationM:num(f.get('networkElevationM'),0),fillDurationHours:Math.max(.25,num(f.get('fillDurationHours'),2)),serviceDiameterMm:Math.max(10,num(f.get('serviceDiameterMm'),25)),sourceDailyCapacity:Math.max(0,num(f.get('sourceDailyCapacity'),50000))});state.settings.branchLengths=Array.from({length:newN},(_,i)=>num(state.settings.branchLengths[i],50));if(newN!==old)assignZoneHouseholds();saveState();rebuildSchedule();}

function hydraulicFor(lengthM,qM3s,diameterMm,roughnessMm,elev=0,K=3){const D=diameterMm/1000;if(!D||qM3s<=0)return {velocity:0,friction:0,minor:0,static:elev,total:elev,reynolds:0};const area=Math.PI*D*D/4,v=qM3s/area,nu=1.004e-6,Re=v*D/nu,eps=roughnessMm/1000;let f;if(Re<1)f=0;else if(Re<2300)f=64/Re;else f=.25/Math.pow(Math.log10((eps/(3.7*D))+(5.74/Math.pow(Re,.9))),2);const hf=f*(Math.max(0,lengthM)/D)*(v*v/(2*9.81));const hm=K*(v*v/(2*9.81));return {velocity:v,friction:hf,minor:hm,static:elev,total:hf+hm+elev,reynolds:Re};}
function chooseDiameter(length,q,rough,targetV,maxLoss,elev=0){const sizes=[16,20,25,32,40,50,63,75,90,110,125,140,160,180,200,225,250,280,315,355,400,450,500];let best=null;for(const d of sizes){const r=hydraulicFor(length,q,d,rough,elev,3);if(r.velocity<=targetV && r.friction+r.minor<=maxLoss){best={d,...r,meets:true};break}}if(!best){const d=sizes[sizes.length-1],r=hydraulicFor(length,q,d,rough,elev,3);best={d,...r,meets:false}}return best}
function calculateHydraulics(){const s=state.settings,days=dayTotals(),peak=Math.max(0,...days.map(d=>d.volume)),hours=s.pumpHours,qMain=(peak/1000)/(hours*3600),main=chooseDiameter(s.mainLength,qMain,s.roughnessMm,s.targetVelocity,s.maxHeadloss,s.networkElevationM);const branchResults=Array.from({length:s.zoneCount},(_,i)=>{let peakZone=0;for(let d=0;d<7;d++){const v=state.schedule.filter(e=>e.dayIndex===d&&getHouse(e.householdId)?.zone===i+1).reduce((a,e)=>a+e.volume,0);peakZone=Math.max(peakZone,v)}const q=(peakZone/1000)/(hours*3600);return {zone:i+1,peak:peakZone,q,length:num(s.branchLengths[i],50),...chooseDiameter(num(s.branchLengths[i],50),q,s.roughnessMm,s.targetVelocity,s.maxHeadloss,0)}});const householdMax=Math.max(0,...state.schedule.map(e=>e.volume));const qService=(householdMax/1000)/(s.fillDurationHours*3600);const serviceLength=Math.max(1,...state.households.filter(h=>h.active!==false).map(h=>num(h.serviceLength,20)));const service=chooseDiameter(serviceLength,qService,s.roughnessMm,s.targetVelocity,s.maxHeadloss,0);const uniformService=hydraulicFor(serviceLength,qService,s.serviceDiameterMm,s.roughnessMm,0,3);const uniformServiceMeets=uniformService.velocity<=s.targetVelocity&&uniformService.friction+uniformService.minor<=s.maxHeadloss;const html=`<div class="result-grid"><div class="result"><small>تدفق تصميم الرئيسي</small><b>${fmt(qMain*1000,3)} لتر/ث</b></div><div class="result"><small>قطر داخلي مرشح للرئيسي</small><b>${main.d} مم</b></div><div class="result"><small>سرعة الرئيسي</small><b>${fmt(main.velocity,2)} م/ث</b></div></div><div class="notice ${main.meets?'good':'warn'}" style="margin-top:12px"><span>${main.meets?'✓':'⚠'}</span><div><strong>${main.meets?'المقاس المرشح يحقق القيود الحسابية المدخلة.':'لم يتحقق القيد ضمن قائمة الأقطار المختبرة.'}</strong>فقد الاحتكاك والملحقات التقديري للرئيسي ${fmt(main.friction+main.minor,2)} م، والرفع الساكن المدخل ${fmt(main.static,2)} م. لا يشمل ذلك جميع الصمامات والتغيرات الفعلية.</div></div><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>الفرع</th><th>الحمل اليومي الأقصى</th><th>التدفق</th><th>الطول</th><th>القطر المرشح</th><th>السرعة</th><th>فقد الرأس التقديري</th><th>النتيجة</th></tr></thead><tbody>${branchResults.map(b=>`<tr><td>منطقة ${b.zone}</td><td>${fmt(b.peak/1000,2)} م³/يوم</td><td>${fmt(b.q*1000,3)} لتر/ث</td><td>${fmt(b.length)} م</td><td><b>${b.d} مم</b></td><td>${fmt(b.velocity,2)} م/ث</td><td>${fmt(b.friction+b.minor,2)} م</td><td>${b.meets?'<span class="pill green">ضمن القيود</span>':'<span class="pill red">راجع التصميم</span>'}</td></tr>`).join('')}</tbody></table></div><div class="grid three" style="margin-top:12px"><div class="result"><small>تدفق وصلة المنزل الأعلى</small><b>${fmt(qService*1000,3)} لتر/ث</b></div><div class="result"><small>قطر وصلة منزل مرشح</small><b>${service.d} مم</b></div><div class="result"><small>القطر الموحد المحدد</small><b>${s.serviceDiameterMm} مم</b><span class="pill ${uniformServiceMeets?'green':'red'}">${uniformServiceMeets?'حقق القيود الأولية':'لا يحقق القيود الأولية'}</span><small>السرعة ${fmt(uniformService.velocity,2)} م/ث · الفقد ${fmt(uniformService.friction+uniformService.minor,2)} م</small></div></div><div class="notice warn" style="margin-top:12px"><span>!</span><div><strong>لا تعتمد القطر المرشح وحده للشراء أو التنفيذ.</strong>الحساب يفترض أن القطر الاسمي يساوي القطر الداخلي، ويستخدم معامل لزوجة وخشونة وتقديرًا لفواقد موضعية. يجب إدخال القطر الداخلي الفعلي حسب مادة الأنبوب وSDR، وارتفاع كل عقدة، والضغط المتاح، وسيناريوهات التشغيل المتزامن. كما يجب التحقق من صلاحية القطر الموحد للتوصيلات أمام أكبر أسرة.</div></div>`;const el=document.getElementById('hydraulicResults');if(el)el.innerHTML=html;}

function openQualityModal(){document.getElementById('modal').innerHTML=`<div class="modal-head"><h3>تسجيل قراءة عكارة</h3><button class="close" onclick="closeModal()">×</button></div><form id="qualityForm"><div class="field-grid"><div class="field"><label>مكان القياس</label><select name="locationType" id="qualityLocation"><option value="main">الخط الرئيسي</option><option value="house">خزان أسرة</option></select></div><div class="field" id="qualityHouseField"><label>الأسرة / الوحدة</label><select name="householdId">${activeHouseholds().map(h=>`<option value="${esc(h.id)}">${esc(h.name)} · ${esc(h.id)}</option>`).join('')}</select></div><div class="field"><label>قيمة العكارة (NTU)</label><input type="number" name="ntu" min="0" max="10000" step="0.01" required></div><div class="field"><label>اسم المسؤول عن القياس</label><input name="operator" maxlength="60" placeholder="اسم الفني"></div><div class="field"><label>تاريخ القراءة</label><input type="date" name="date" value="${todayISO()}" required></div><div class="field"><label>ملاحظات</label><input name="note" maxlength="120"></div></div><div class="form-actions"><button class="btn primary">حفظ القراءة</button><button type="button" class="btn" onclick="closeModal()">إلغاء</button></div></form>`;document.getElementById('modalBackdrop').classList.add('show');const select=document.getElementById('qualityLocation');const update=()=>document.getElementById('qualityHouseField').classList.toggle('hidden',select.value!=='house');select.addEventListener('change',update);update();document.getElementById('qualityForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget);state.qualityReadings.unshift({id:`Q-${Date.now()}`,locationType:f.get('locationType'),householdId:f.get('locationType')==='house'?f.get('householdId'):null,ntu:num(f.get('ntu')),operator:String(f.get('operator')||''),date:f.get('date'),note:String(f.get('note')||''),timestamp:new Date().toISOString()});saveState();closeModal();ren function ingestSensorPayload(payload){
  if(!payload||typeof payload!=='object'||!payload.deviceId)throw new Error('حمولة الجهاز غير صالحة.');
  const d=state.sensorDevices.find(x=>x.id===String(payload.deviceId)&&x.active);if(!d)throw new Error('معرّف الجهاز غير مسجل.');
  const stamp=payload.timestamp||new Date().toISOString();
  if(d.kind==='flow'){
    const v=num(payload.volumeLitres,-1);if(v<0||!payload.periodStart||!payload.periodEnd||new Date(payload.periodEnd)<=new Date(payload.periodStart))throw new Error('بيانات التدفق أو الفترة غير صالحة.');
    const node=getNode(d.nodeType,d.nodeId);state.flowReadings.unshift({id:`FL-GW-${Date.now()}`,nodeType:d.nodeType,nodeId:d.nodeId,nodeLabel:node?.label||d.nodeId,date:String(payload.periodStart).slice(0,10),periodStart:payload.periodStart,periodEnd:payload.periodEnd,volumeLitres:v,deviceId:d.id,source:'device',timestamp:stamp});
  }else if(d.kind==='quality'){
    const v=num(payload.ntu,-1);if(v<0)throw new Error('قراءة العكارة غير صالحة.');const n=getNode(d.nodeType,d.nodeId);const r={id:`Q-GW-${Date.now()}`,nodeType:d.nodeType,nodeId:d.nodeId,nodeLabel:n?.label||d.nodeId,locationType:d.nodeType==='tank'?'house':d.nodeType,householdId:n?.householdId||null,ntu:v,ph:payload.ph==null?null:num(payload.ph),ec:payload.ec==null?null:num(payload.ec),chlorine:payload.chlorine==null?null:num(payload.chlorine),date:String(stamp).slice(0,10),source:'device',deviceId:d.id,timestamp:stamp,operator:'بوابة الأجهزة'};state.qualityReadings.unshift(r);const flags=qualityFlags(r);if(flags.length)state.qualityAlerts.unshift({id:`QA-GW-${Date.now()}`,readingId:r.id,nodeType:d.nodeType,nodeId:d.nodeId,nodeLabel:r.nodeLabel,flags,status:'open',createdAt:stamp});
  }else if(d.kind==='level'){
    const level=num(payload.levelPercent,-1);if(level<0||level>100)throw new Error('نسبة مستوى الخزان يجب أن تكون بين 0 و100.');recordLevelReading(d.nodeId,level,payload.volumeLitres==null?'':num(payload.volumeLitres),'device',d.id);
  }
  d.lastSeen=stamp;d.lastPayloadSource='local-preview';d.status='test';d.connection='اختبار محلي؛ لا يوجد اتصال جهاز فعلي';saveState();if(currentRole==='admin')renderAll();return {ok:true,deviceId:d.id,kind:d.kind,previewOnly:true};
}

/* ===== Hardware integration readiness layer (configuration + API contract) =====
   Current operation remains local/demo. Real devices must communicate with a secure
   server/gateway; browser code must never contain device secrets or accept public
   unauthenticated telemetry directly.
*/
function ensureDeviceIntegrationConfig(){
  state.deviceIntegration=state.deviceIntegration||{};
  state.deviceIntegration={
    siteId:String(state.deviceIntegration.siteId||'SITE-DEMO'),
    gatewayId:String(state.deviceIntegration.gatewayId||'GW-001'),
    transport:['https-rest','mqtts'].includes(state.deviceIntegration.transport)?state.deviceIntegration.transport:'https-rest',
    apiBaseUrl:String(state.deviceIntegration.apiBaseUrl||''),
    telemetryRoute:'/api/v1/sites/{siteId}/telemetry',
    commandRoute:'/api/v1/sites/{siteId}/valve-commands',
    deviceStatusRoute:'/api/v1/sites/{siteId}/devices/status',
    mqttTelemetryTopic:'aqua/{siteId}/{deviceId}/telemetry',
    mqttStatusTopic:'aqua/{siteId}/{deviceId}/status',
    mqttCommandTopic:'aqua/{siteId}/{deviceId}/commands',
    mode:'local-demo'
  };
  state.valveCommandQueue=Array.isArray(state.valveCommandQueue)?state.valveCommandQueue:[];
  state.meta=state.meta||{};
  state.meta.gatewayMessageIds=Array.isArray(state.meta.gatewayMessageIds)?state.meta.gatewayMessageIds:[];
}
function deviceUnit(kind){return ({flow:'L/period',quality:'NTU + pH + µS/cm + mg/L',level:'%',valve:'open/closed/fault'})[kind]||'';}
function deviceTopic(deviceId){const c=state.deviceIntegration||{};return `aqua/${c.siteId||'SITE-DEMO'}/${deviceId}/telemetry`;}
function enrichDeviceMetadata(){
  ensureDeviceIntegrationConfig();
  ensureInstrumentation(state);
  const labels={flow:'عداد تدفق',quality:'حساس جودة المياه',level:'حساس مستوى الخزان',valve:'مشغل صمام آلي'};
  state.sensorDevices.forEach(d=>{
    d.gatewayId=d.gatewayId||state.deviceIntegration.gatewayId;
    d.protocol=d.protocol||state.deviceIntegration.transport;
    d.unit=d.unit||deviceUnit(d.kind);
    d.measurement=d.measurement||({flow:'volumeLitres',quality:'ntu',level:'levelPercent',valve:'state'}[d.kind]||'');
    d.topic=d.topic||deviceTopic(d.id);
    d.hardwareModel=d.hardwareModel||'يحدد عند التوريد';
    d.deviceLabel=d.deviceLabel||labels[d.kind]||d.kind;
    d.integrationStatus=d.integrationStatus||'not-configured';
    if(d.kind==='valve'){
      const h=state.households.find(x=>x.id===d.nodeId);
      if(h)d.nodeLabel=`صمام توصيل · ${h.name||h.id}`;
      d.active=!!h&&h.active!==false;
    }
    if(d.lastPayloadSource==='local-preview'){d.status='test';d.connection='اختبار محلي؛ ليس اتصالًا فعليًا';}
  });
}
function validateDeviceTelemetry(payload){
  if(!payload||typeof payload!=='object'||Array.isArray(payload))throw new Error('حمولة الجهاز يجب أن تكون كائن JSON.');
  const id=String(payload.deviceId||'');
  if(!id)throw new Error('معرّف الجهاز deviceId مطلوب.');
  const d=state.sensorDevices.find(x=>x.id===id&&x.active);
  if(!d)throw new Error('معرّف الجهاز غير مسجل أو غير نشط.');
  if(payload.kind&&payload.kind!==d.kind)throw new Error('نوع الحمولة لا يطابق نوع الجهاز المسجل.');
  const stamp=payload.timestamp||new Date().toISOString();
  if(!Number.isFinite(Date.parse(stamp)))throw new Error('الطابع الزمني غير صالح.');
  if(Date.parse(stamp)>Date.now()+5*60*1000)throw new Error('وقت القراءة يقع في المستقبل.');
  if(d.kind==='flow'){
    const v=Number(payload.volumeLitres);
    if(!Number.isFinite(v)||v<0)throw new Error('volumeLitres يجب أن يكون رقمًا غير سالب.');
    if(!payload.periodStart||!payload.periodEnd||!Number.isFinite(Date.parse(payload.periodStart))||!Number.isFinite(Date.parse(payload.periodEnd))||Date.parse(payload.periodEnd)<=Date.parse(payload.periodStart))throw new Error('فترة عداد التدفق غير صالحة.');
  }else if(d.kind==='quality'){
    const ntu=Number(payload.ntu);if(!Number.isFinite(ntu)||ntu<0)throw new Error('ntu مطلوب ويجب أن يكون غير سالب.');
    if(payload.ph!=null&&payload.ph!==''&&(!Number.isFinite(Number(payload.ph))||Number(payload.ph)<0||Number(payload.ph)>14))throw new Error('قيمة pH يجب أن تكون بين 0 و14.');
    for(const key of ['ec','chlorine'])if(payload[key]!=null&&payload[key]!==''&&(!Number.isFinite(Number(payload[key]))||Number(payload[key])<0))throw new Error(`${key} يجب أن يكون رقمًا غير سالب.`);
  }else if(d.kind==='level'){

res(q)}</td><td>${p?fmtLitres(p.sharedTankCapacityL):'غير محدد'}</td><td>${p?fmt(days,1)+' يوم':'—'}</td><td>${p?`م${p.zone}`:'—'}</td><td>${p?'<span class="pill green">مُعدّ</span>':'<span class="pill amber">يحتاج إعدادًا</span>'}</td><td><button class="btn small" onclick="openBuildingModal('${esc(g.name).replace(/'/g,"\\'")}')">${p?'تعديل':'إعداد'}</button></td></tr>`}).join('')||'<tr><td colspan="9" class="empty">لا توجد شقق مسجلة بعد. سجّل وحدة سكنية من نوع «شقة داخل عمارة» لإضافتها هنا.</td></tr>'}</tbody></table></div></div><div class="card" style="margin-top:16px"><div class="section-title"><div><h3>ملاحظات التصميم للمباني المرتفعة</h3><p>عناصر يجب إدخالها في التصميم الهندسي التفصيلي.</p></div></div><div class="metric-line"><span>التخزين</span><b>خزان مشترك أو عدة خزانات بحسب تقسيم الضغط والاحتياط</b></div><div class="metric-line"><span>الضغط</span><b>مضخات تعزيز ومناطق ضغط بحسب ارتفاع المبنى</b></div><div class="metric-line"><span>القياس</span><b>عداد مدخل المبنى، وعدادات فرعية للشقق عند الحاجة</b></div><div class="metric-line"><span>الطوارئ</span><b>حساب الاحتياط والطاقة البديلة ومتطلبات الحريق محليًا</b></div></div>`;

  document.getElementById('modalBackdrop').classList.add('show');document.getElementById('buildingForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget),n=String(f.get('name')||'').trim();if(!n){toast('أدخل اسم المبنى.');return}let profile=getBuildingProfile(n);if(!profile){profile={id:`BLD-${Date.now().toString(36).toUpperCase()}`,name:n};state.buildingProfiles.push(profile);}Object.assign(profile,{name:n,zone:Math.max(1,Math.min(state.settings.zoneCount,Math.round(num(f.get('zone'),1)))),branch2No:Math.max(1,Math.min(state.settings.branch2CountPerZone,Math.round(num(f.get('branch2No'),1)))),floors:Math.max(1,Math.round(num(f.get('floors'),1))),sharedTankCapacityL:Math.max(0,num(f.get('sharedTankCapacityL'))),reservePercent:Math.max(0,Math.min(50,num(f.get('reservePercent'),10))),backupPowerHours:Math.max(0,num(f.get('backupPowerHours'))),pumpNotes:String(f.get('pumpNotes')||''),updatedAt:new Date().toISOString()});ensureInstrumentation(state);saveState();closeModal();renderAll();toast('تم حفظ ملف المبنى والخزان المشترك.');});

/* Source and electrical resilience */
renderOperations=function(){
  const s=state.settings,cap=effectiveDailyCapacity(s),pump=effectivePumpHours(s),events=state.operationalEvents.slice().sort((a,b)=>b.timestamp.localeCompare(a.timestamp));
  document.getElementById('content').innerHTML=`<div class="page-head"><div><h2>الإمداد والطاقة والتوقفات</h2><p>ضبط قدرة المصدر وساعات تشغيل المضخة وتوثيق الانقطاعات.</p></div></div><div class="notice info"><span>ℹ</span><div><strong>الجدول يتأثر بالسعة المتاحة.</strong>تُخفض السعة اليومية المكافئة عند تقييد مصدر المياه أو ساعات الكهرباء، وتُعاد موازنة الجدولة بعد الحفظ.</div></div><div class="stats"><div class="card stat"><div><div class="label">قدرة المصدر الأساسية</div><div class="value">${fmtLitres(s.sourceDailyCapacity)}</div><div class="sub">لتر/يوم في الظروف المرجعية</div></div><div class="stat-icon cyan">↧</div></div><div class="card stat"><div><div class="label">السعة المتاحة حاليًا</div><div class="value">${fmtLitres(cap)}</div><div class="sub">بعد احتساب الطاقة والمصدر</div></div><div class="stat-icon green">✓</div></div><div class="card stat"><div><div class="label">ساعات ضخ متاحة</div><div class="value">${fmt(pump,1)}</div><div class="sub">من أصل ${fmt(s.pumpHours,1)} ساعة</div></div><div class="stat-icon blue">◷</div></div><div class="card stat"><div><div class="label">التوقفات المسجلة</div><div class="value">${events.length}</div><div class="sub">سجل تشغيلي</div></div><div class="stat-icon amber">!</div></div></div><div class="card" style="margin-top:16px"><div class="section-title"><div><h3>حالة الإمداد والطاقة</h3><p>غيّر الحالة ثم احفظ لتحديث الجدولة.</p></div></div><form id="operationsForm"><div class="field-grid"><div class="field"><label>حالة مصدر المياه</label><select name="sourceStatus"><option value="available" ${s.sourceStatus==='available'?'selected':''}>متاح</option><option value="limited" ${s.sourceStatus==='limited'?'selected':''}>محدود</option><option value="off" ${s.sourceStatus==='off'?'selected':''}>متوقف</option></select></div><div class="field"><label>نسبة توفر المصدر عند التقييد (%)</label><input type="number" name="sourceAvailabilityPercent" min="0" max="100" value="${s.sourceAvailabilityPercent}"></div><div class="field"><label>حالة الكهرباء</label><select name="powerStatus"><option value="available" ${s.powerStatus==='available'?'selected':''}>متاحة</option><option value="limited" ${s.powerStatus==='limited'?'selected':''}>متقطعة / محدودة</option><option value="off" ${s.powerStatus==='off'?'selected':''}>منقطعة</option></select></div><div class="field"><label>ساعات الكهرباء المتاحة</label><input type="number" name="powerAvailableHours" min="0" max="24" step="0.5" value="${s.powerAvailableHours}"></div><div class="field"><label>ساعات الطاقة الاحتياطية</label><input type="number" name="backupPowerHours" min="0" max="24" step="0.5" value="${s.backupPowerHours}"></div><div class="field"><label>سبب التغيير / الحالة</label><input name="note" maxlength="160" placeholder="انقطاع مصدر، تقنين كهرباء، صيانة مضخة..."></div></div><div class="form-actions"><button class="btn primary" type="submit">حفظ الحالة وإعادة الجدولة</button></div></form></div><div class="card" style="margin-top:16px"><div class="section-title"><div><h3>سجل الانقطاعات والتغييرات</h3><p>توثيق الحالة السابقة والجديدة والمسؤول.</p></div><button class="btn small" onclick="addOperationalEvent()">＋ تسجيل حادثة</button></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>التغيير</th><th>ملاحظات</th><th>المسؤول</th></tr></thead><tbody>${events.map(x=>`<tr><td>${new Date(x.timestamp).toLocaleString('ar-PS')}</td><td>${esc(x.type)}</td><td>${esc(x.change||'—')}</td><td>${esc(x.note||'—')}</td><td>${esc(x.operator||'—')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد أحداث تشغيلية مسجلة.</td></tr>'}</tbody></table></div></div>`;
  document.getElementById('operationsForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget),old=`مصدر:${s.sourceStatus} / كهرباء:${s.powerStatus} / سعة:${fmtLitres(effectiveDailyCapacity(s))}`;Object.assign(s,{sourceStatus:String(f.get('sourceStatus')),sourceAvailabilityPercent:Math.max(0,Math.min(100,num(f.get('sourceAvailabilityPercent'),100))),powerStatus:String(f.get('powerStatus')),powerAvailableHours:Math.max(0,Math.min(24,num(f.get('powerAvailableHours'),0))),backupPowerHours:Math.max(0,Math.min(24,num(f.get('backupPowerHours'),0)))});state.operationalEvents.unshift({id:`OP-${Date.now()}`,timestamp:new Date().toISOString(),type:'تغيير حالة الإمداد / الطاقة',change:`${old} ← مصدر:${s.sourceStatus} / كهرباء:${s.powerStatus} / سعة:${fmtLitres(effectiveDailyCapacity(s))}`,note:String(f.get('note')||''),operator:'المسؤول'});state.schedule=buildScheduleFor(state.households,s,s.weekStart);state.meta.lastScheduleBuild=new Date().toISOString();saveState();renderAll();toast('تم حفظ حالة الإمداد والطاقة وإعادة الجدولة.');});
};
function addOperationalEvent(){document.getElementById('modal').innerHTML=`<div class="modal-head"><h3>تسجيل حادثة تشغيلية</h3><button class="close" type="button" onclick="closeModal()">×</button></div><form id="opEventForm"><div class="field-grid"><div class="field"><label>نوع الحادثة</label><select name="type"><option>انقطاع مصدر المياه</option><option>انقطاع كهرباء</option><option>عطل مضخة</option><option>صيانة شبكة</option><option>تسرب / كسر أنبوب</option><option>حادثة جودة مياه</option><option>عودة التشغيل</option></select></div><div class="field"><label>المسؤول</label><input name="operator" maxlength="60"></div><div class="field" style="grid-column:1/-1"><label>التفاصيل</label><input name="note" maxlength="180" required></div></div><div class="form-actions"><button class="btn primary">حفظ الحادثة</button></div></form>`;document.getElementById('modalBackdrop').classList.add('show');document.getElementById('opEventForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget);state.operationalEvents.unshift({id:`OP-${Date.now()}`,timestamp:new Date().toISOString(),type:String(f.get('type')),note:String(f.get('note')||''),operator:String(f.get('operator')||''),change:'سجل تشغيلي'});saveState();closeModal();renderAll();toast('تم تسجيل الحادثة التشغيلية.');});}

eAlertsEnabled" ${s.chlorineAlertsEnabled?'checked':''}> تفعيل تنبيهات الكلور المتبقي</label></div><div class="form-actions"><button class="btn primary">حفظ الحدود وملف الموقع</button></div></form><div class="notice warn" style="margin:14px 0 0"><span>⚠</span><div>حدود pH وEC والكلور هنا إعدادات تشغيلية يحددها المختص وفق معيار الدولة ومصدر المياه وطريقة المعالجة. تفعيل التنبيه لا يجعل القراءة شهادة مطابقة، وتعطيله لا يعني صلاحية المياه.</div></div></section>`;
  document.getElementById('content').insertAdjacentHTML('beforeend',html);
  document.getElementById('extendedSettingsForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget);Object.assign(s,{siteName:String(f.get('siteName')||''),countryOrRegion:String(f.get('countryOrRegion')||''),lossAlertPercent:Math.max(0,Math.min(100,num(f.get('lossAlertPercent'),10))),turbidityLimit:Math.max(.1,num(f.get('turbidityLimit'),5)),phMin:Math.max(0,Math.min(14,num(f.get('phMin'),6.5))),phMax:Math.max(0,Math.min(14,num(f.get('phMax'),8.5))),ecLimit:Math.max(0,num(f.get('ecLimit'),2500)),chlorineMin:Math.max(0,num(f.get('chlorineMin'),.2)),tankLowLevelPercent:Math.max(0,Math.min(100,num(f.get('tankLowLevelPercent'),20))),phAlertsEnabled:f.get('phAlertsEnabled')==='on',ecAlertsEnabled:f.get('ecAlertsEnabled')==='on',chlorineAlertsEnabled:f.get('chlorineAlertsEnabled')==='on'});saveState();renderAll();toast('تم حفظ إعدادات الموقع وحدود المراقبة.');});
};

function scheduleTable(events){if(!events.length)return '<div class="empty">لا توجد عمليات تعبئة في هذه القائمة.</div>';return `<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>اليوم</th><th>الأسرة</th><th>المنطقة</th><th>الكمية المخططة</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${events.map(e=>{const h=getHouse(e.householdId);return `<tr><td>${dateLabel(e.date)}</td><td>${DAY_NAMES[e.dayIndex]}</td><td>${esc(h?.name||e.householdId)}</td><td>${h?.zone??'—'}</td><td>${fmtLitres(e.volume)}</td><td>${e.status==='done'?'<span class="pill green">تمت</span>':e.status==='blocked'?`<span class="pill red">محجوبة</span><div class="tiny">${esc(e.blockReason||'غير متاح')}</div>`:'<span class="pill amber">مجدولة</span>'}${e.capacityExceeded&&e.status!=='blocked'?'<div><span class="pill red">يتجاوز سعة الإمداد اليومية</span></div>':''}</td><td>${e.status==='done'?'<span class="tiny">سُجلت '+dateLabel(e.filledAt)+'</span>':e.status==='blocked'?'<span class="tiny">لا تؤكد قبل عودة الخدمة</span>':`<button class="btn small accent" onclick="completeFill('${esc(e.id)}')">تأكيد التعبئة</button>`}</td></tr>`}).join('')}</tbody></table></div>`}
function completeFill(id){const e=state.schedule.find(x=>x.id===id);if(!e||e.status==='done')return;if(e.status==='blocked'||effectiveDailyCapacity(state.settings)<=0){toast('لا يمكن تأكيد التعبئة: مصدر المياه أو الطاقة غير متاح.');return}_legacyCompleteFill(id);}
function filterSchedule(v){const es=state.schedule.filter(e=>v==='all'||e.status===v).sort((a,b)=>a.date.localeCompare(b.date));document.getElementById('scheduleRows').innerHTML=scheduleTable(es)}
function renderSchedule(){
  const days=dayTotals(),max=Math.max(1,...days.map(d=>d.volume)),events=state.schedule.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.householdId.localeCompare(b.householdId)),cap=effectiveDailyCapacity(state.settings),blocked=events.filter(e=>e.status==='blocked').length;

Filter" onchange="filterSchedule(this.value)"><option value="all">كل الحالات</option><option value="pending">مجدولة فقط</option><option value="blocked">محجوبة فقط</option><option value="done">مكتملة فقط</option></select></div><div id="scheduleRows">${scheduleTable(events)}</div></div>`;

/* Pressure readings per scheduled fill: min/max are derived from all samples in that fill. */
function ensurePressureReadings(){ if(!Array.isArray(state.pressureReadings)) state.pressureReadings=[]; }
function currentWeekRange(){const start=state.settings.weekStart||todayISO();return {start,end:isoDate(addDays(parseISO(start),7))}}
function pressureEventsForHousehold(h){const w=currentWeekRange();return (state.schedule||[]).filter(e=>e.householdId===h.id&&e.date>=w.start&&e.date<w.end&&e.status!=='blocked').sort((a,b)=>a.date.localeCompare(b.date)||num(a.part)-num(b.part));}
function weeklyPressureKey(h){return `WEEK-${state.settings.weekStart||todayISO()}-${h.id}`;}
function pressureStats(householdId,eventId){
  ensurePressureReadings();
  const rows=state.pressureReadings.filter(r=>r.householdId===householdId&&r.eventId===eventId&&Number.isFinite(Number(r.pressureBar))).sort((a,b)=>String(a.timestamp).localeCompare(String(b.timestamp)));
  if(!rows.length)return {rows,min:null,max:null,last:null};
  const values=rows.map(r=>Number(r.pressureBar));
  return {rows,min:Math.min(...values),max:Math.max(...values),last:rows[rows.length-1]};
}
function pressureStatsMarkup(householdId,eventId){
  const s=pressureStats(householdId,eventId);
  return `<div class="grid three" style="margin-top:12px"><div class="result"><small>أقل ضغط مسجّل تلقائيًا</small><b>${s.min===null?'—':fmt(s.min,2)+' bar'}</b></div><div class="result"><small>أعلى ضغط مسجّل تلقائيًا</small><b>${s.max===null?'—':fmt(s.max,2)+' bar'}</b></div><div class="result"><small>عدد القراءات</small><b>${fmt(s.rows.length)}</b><small>${s.last?'آخر قراءة '+new Date(s.last.timestamp).toLocaleString('ar-PS'):'لا توجد قراءات بعد'}</small></div></div>${s.rows.length===1?'<div class="notice warn" style="margin-top:10px"><span>ℹ</span><div>سُجلت قراءة واحدة فقط؛ ستتساوى قيمة الأقل والأعلى مؤقتًا. أضف قراءات أخرى أثناء التعبئة حتى يرصد النظام الحدين الفعليين ضمن القراءات المسجلة.</div></div>':''}`;
}
function pressureReadingsRows(rows){return rows.slice().sort((a,b)=>String(b.timestamp).localeCompare(String(a.timestamp))).slice(0,8).map(r=>`<tr><td>${fmt(r.pressureBar,2)} bar</td><td>${new Date(r.timestamp).toLocaleString('ar-PS')}</td><td>${r.enteredBy==='admin'?'المسؤول':'الأسرة'}</td><td>${r.source==='device'?'حساس':'إدخال يدوي'}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">لا توجد قراءات مسجلة لهذه التعبئة.</td></tr>'}
function recordFamilyPressure(e,householdId){
  e.preventDefault();ensurePressureReadings();
  const form=e.currentTarget,fd=new FormData(form),pressure=Number(fd.get('pressureBar')),eventId=String(fd.get('eventId')||'');
  if(!eventId||!Number.isFinite(pressure)||pressure<0||pressure>40){toast('أدخل قراءة ضغط صحيحة بين 0 و40 bar.');return;}
  state.pressureReadings.push({id:`PR-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,householdId,eventId,pressureBar:pressure,timestamp:new Date().toISOString(),enteredBy:'family',source:'manual'});
  if(!saveState()){toast('تعذر حفظ قراءة الضغط.');return;}
  renderAll();toast('تم حفظ قراءة الضغط وتحديث أقل وأعلى ضغط لهذه التعبئة.');
}
function updateFamilyPressureStats(householdId){
  const sel=document.getElementById('familyPressureEvent');const target=document.getElementById('familyPressureStats');
  if(sel&&target)target.innerHTML=pressureStatsMarkup(householdId,sel.value);
  const history=document.getElementById('familyPressureRows');
  if(sel&&history)history.innerHTML=pressureReadingsRows(pressureStats(householdId,sel.value).rows);
}

  <div class="notice info"><span>ℹ</span><div>أدخل قراءة الضغط أكثر من مرة أثناء التعبئة. تُحسب قيمة الضغط الأدنى والأعلى من القراءات المسجلة، ولا يمكن استنتاج الضغط الأدنى من قراءة الضغط الأعلى وحدها. عند ربط حساس ضغط فعلي يمكن استبدال الإدخال اليدوي بقراءات تلقائية.</div></div>
  <form id="familyPressureForm"><div class="field-grid"><div class="field"><label>التعبئة</label><select name="eventId" id="familyPressureEvent" onchange="updateFamilyPressureStats('${esc(h.id)}')">${eventOptions}</select></div><div class="field"><label>قراءة الضغط أثناء هذه التعبئة (bar) *</label><input name="pressureBar" type="number" min="0" max="40" step="0.01" required placeholder="مثال: 2.4"></div></div><div class="form-actions"><button class="btn primary" type="submit">حفظ قراءة الضغط</button></div></form>

function saveAreaForm(e){
  e.preventDefault();const f=new FormData(e.currentTarget),name=String(f.get('name')||'').trim();
  if(name.length<2){toast('أدخل اسمًا واضحًا للمنطقة.');return;}
  const optional=(v)=>String(v??'').trim()===''?null:Number(v);
  const lowest=optional(f.get('lowestElevationM')),highest=optional(f.get('highestElevationM')),sourceElev=optional(f.get('sourceElevationM'));
  if(lowest!==null&&highest!==null&&lowest>highest){toast('أدنى ارتفاع لا يمكن أن يكون أكبر من أعلى ارتفاع.');return;}
  const id=String(f.get('id')||'');let a=id?getArea(id):null;
  if(!a){const newId=`AREA-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;a={id:newId,createdAt:new Date().toISOString()};state.areas.push(a);}
  Object.assign(a,{name,country:String(f.get('country')||'').trim(),city:String(f.get('city')||'').trim(),description:String(f.get('description')||'').trim(),terrainType:String(f.get('terrainType')||'flat'),lowestElevationM:lowest,highestElevationM:highest,sourceElevationM:sourceElev,population:Math.max(0,Math.round(num(f.get('population'),0))),homesCount:Math.max(0,Math.round(num(f.get('homesCount'),0))),apartmentBuildingsCount:Math.max(0,Math.round(num(f.get('apartmentBuildingsCount'),0))),apartmentsCount:Math.max(0,Math.round(num(f.get('apartmentsCount'),0))),dailyInletLitres:Math.max(0,num(f.get('dailyInletLitres'),0)),inletFlowLps:optional(f.get('inletFlowLps')),inletPressureM:optional(f.get('inletPressureM')),supplyHoursPerDay:optional(f.get('supplyHoursPerDay')),notes:String(f.get('notes')||'').trim(),updatedAt:new Date().toISOString()});
  saveState();closeModal();renderAll();toast('تم حفظ ملف المنطقة.');
}
function deleteArea(id){const a=getArea(id);if(!a)return;const linked=state.households.filter(h=>h.areaId===id).length;if(linked){toast(`لا يمكن حذف المنطقة لأنها مرتبطة بـ ${linked} أسرة. انقل الأسر إلى منطقة أخرى أولًا.`);return;}if(!confirm(`حذف ملف المنطقة «${a.name}»؟`))return;state.areas=state.areas.filter(x=>x.id!==id);state.registrationRequests.forEach(r=>{if(r.areaId===id)r.areaId='';});saveState();renderAll();toast('تم حذف المنطقة.');}

renderAll=function(){
  ensureDeviceIntegrationConfig();
  enrichDeviceMetadata();
  if(PORTAL_MODE==='family'){
    currentRole='family';adminUnlocked=false;
    document.getElementById('adminNav').classList.add('hidden');
    document.getElementById('familyLogout').classList.toggle('hidden',!familySessionId);
    document.getElementById('adminLogout').classList.add('hidden');
    updateTop();renderFamily();return;
  }
  currentRole='admin';familySessionId=null;
  document.getElementById('adminNav').classList.remove('hidden');

  const renders={dashboard:renderDashboard,requests:renderRequests,areas:renderAreas,households:renderHouseholds,schedule:renderSchedule,network:renderNetwork,quality:renderQuality,loss:renderLoss,reports:renderReports,settings:renderSettings,buildings:renderBuildings,sensors:renderSensors,operations:renderOperations};(renders[currentView]||renderDashboard)();
};

    <div class="field" style="grid-column:1/-1"><label>عنوان الخادم (اختياري الآن)</label><input name="apiBaseUrl" type="url" placeholder="https://your-server.example" value="${esc(c.apiBaseUrl||'')}"><small>اتركه فارغًا إلى حين تجهيز الخادم. لا يتم الاتصال بهذا العنوان من النموذج الحالي.</small></div>

  <div class="grid three" style="margin-top:16px"><div class="result"><small>مسار استقبال القراءات</small><b dir="ltr" style="font-size:11px">${esc(c.telemetryRoute)}</b></div><div class="result"><small>مسار أوامر الصمامات</small><b dir="ltr" style="font-size:11px">${esc(c.commandRoute)}</b></div><div class="result"><small>عدد مشغلات الصمامات المسجلة</small><b>${state.sensorDevices.filter(d=>d.kind==='valve'&&d.active).length}</b></div></div>

  <div class="notice info" style="margin-top:12px"><strong>تدفق الربط عند التنفيذ:</strong> حساس/عداد/مشغل ← بوابة ميدانية ← API موثّق أو وسيط MQTT آمن ← قاعدة البيانات ← تحديث لوحة المسؤول والأسرة. أوامر الصمامات تتطلب موافقة الخادم وتأكيد التنفيذ من الجهاز؛ واجهة الويب لا ترسل أوامر حقيقية في الوقت الحالي.</div>

  // Rebuild the weekly schedule using the actual two-part household quota.
  buildScheduleFor = function(households, settings, weekStart){

  getMeasurementNodes = function(){

      for(let z=1;z<=state.settings.zoneCount;z++){const used=new Set(Array.from({length:state.settings.branch2CountPerZone},(_,i)=>i+1));activeHouseholds().filter(h=>String(h.areaId||'')===aid&&Number(h.zone||1)===z).forEach(h=>used.add(Math.max(1,Math.round(num(h.branch2No,1)))));for(const b of [...used].sort((a,b)=>a-b))nodes.push({type:'branch2',id:branch2Id(z,b,aid),label:`الخط الفرعي الثاني · ${scope.name} · المنطقة ${z} · الفرع ${b}`,zone:z,branch2No:b,areaId:aid});}

    const p=getBuildingProfile(name,areaId),first=group?.households[0];
    const areaOpts=(state.areas||[]).map(a=>`<option value="${esc(a.id)}" ${String(areaId||first?.areaId||'')===String(a.id)?'selected':''}>${esc(a.name)}</option>`).join('');
    document.getElementById('modal').innerHTML=`<div class="modal-head"><h3>إعداد بيانات المبنى</h3><button class="close" type="button" onclick="closeModal()">×</button></div><form id="buildingForm"><div class="field-grid"><div class="field"><label>اسم المبنى *</label><input name="name" required maxlength="80" value="${esc(name)}"></div><div class="field"><label>المنطقة</label><select name="areaId">${areaOpts}</select></div><div class="field"><label>القطاع</label><select name="zone">${Array.from({length:state.settings.zoneCount},(_,i)=>`<option value="${i+1}" ${(p?.zone||first?.zone||1)===i+1?'selected':''}>القطاع ${i+1}</option>`).join('')}</select></div><div class="field"><label>رقم الفرع الثاني</label><select name="branch2No">${Array.from({length:state.settings.branch2CountPerZone},(_,i)=>`<option value="${i+1}" ${(p?.branch2No||first?.branch2No||1)===i+1?'selected':''}>الفرع ${i+1}</option>`).join('')}</select></div><div class="field"><label>عدد الطوابق</label><input name="floors" type="number" min="1" max="250" value="${p?.floors||4}"></div><div class="field"><label>سعة الخزان المشترك (لتر)</label><input name="sharedTankCapacityL" type="number" min="0" step="100" value="${p?.sharedTankCapacityL||0}"></div><div class="field"><label>نسبة الاحتياط (%)</label><input name="reservePercent" type="number" min="0" max="50" step="1" value="${p?.reservePercent??10}"></div><div class="field"><label>ملاحظات المضخات / مناطق الضغط</label><input name="pumpNotes" maxlength="140" value="${esc(p?.pumpNotes||'')}"></div></div><div class="notice info">العداد المشترك على مدخل الخزان، وعداد تدفق مستقل على مخرج كل شقة. لا يُحسب فرق المدخل والمخارج كتسرب قبل تصحيح تغير مخزون الخزان.</div><div class="form-actions"><button class="btn primary">حفظ المبنى</button><button class="btn" type="button" onclick="closeModal()">إلغاء</button></div></form>`;
    document.getElementById('modalBackdrop').classList.add('show');
    document.getElementById('buildingForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget),n=String(f.get('name')||'').trim(),aid=String(f.get('areaId')||'');if(!n){toast('أدخل اسم المبنى.');return}let profile=getBuildingProfile(n,aid);if(!profile){profile={id:`BLD-${Date.now().toString(36).toUpperCase()}`,name:n,areaId:aid};state.buildingProfiles.push(profile);}Object.assign(profile,{name:n,areaId:aid,zone:Math.max(1,Math.min(state.settings.zoneCount,Math.round(num(f.get('zone'),1)))),branch2No:Math.max(1,Math.min(state.settings.branch2CountPerZone,Math.round(num(f.get('branch2No'),1)))),floors:Math.max(1,Math.round(num(f.get('floors'),4))),sharedTankCapacityL:Math.max(0,num(f.get('sharedTankCapacityL'))),reservePercent:Math.max(0,Math.min(50,num(f.get('reservePercent'),10))),pumpNotes:String(f.get('pumpNotes')||''),updatedAt:new Date().toISOString()});ensureInstrumentation(state);saveState();closeModal();renderAll();toast('تم حفظ ملف المبنى وعدادات الشقق في النموذج.');});
  };

  // Pressure safety gate. A low-point pressure limit is entered from the pipe rating/local code;
  // without it the app reports the pressure estimate but does not mark pressure safety as passed.
  const oldOpenAreaHydraulicModal=openAreaHydraulicModal;
  openAreaHydraulicModal=function(areaId){
    oldOpenAreaHydraulicModal(areaId);
    const f=document.getElementById('areaHydraulicForm');if(!f)return;
    const i=state.areas.find(a=>a.id===areaId)?.hydraulicDesign?.inputs||{};
    if(!f.querySelector('[name="maxPressureAtLowPointM"]')){const box=document.createElement('div');box.className='field';box.innerHTML=`<label>أقصى ضغط مسموح عند أدنى نقطة (م عمود ماء)</label><input name="maxPressureAtLowPointM" type="number" min="1" max="500" step="0.5" value="${i.maxPressureAtLowPointM??''}" placeholder="حسب تصنيف الأنبوب والكود المحلي"><small>اتركه فارغًا إذا لم يُحدد بعد؛ عندها لا يجتاز فحص الضغط الأقصى.</small>`;const head=[...f.querySelectorAll('h4')].find(x=>x.textContent.includes('المناسيب والضغط'));if(head&&head.nextElementSibling)head.nextElementSibling.appendChild(box);}
  };
  const oldCalculateAreaHydraulicForm=calculateAreaHydraulicForm;
  calculateAreaHydraulicForm=function(e,areaId){
    const f=e.currentTarget,raw=String(new FormData(f).get('maxPressureAtLowPointM')??'').trim();
    const limit=raw===''?null:Number(raw);
    if(limit!==null&&(!Number.isFinite(limit)||limit<=0)){e.preventDefault();toast('أدخل حد ضغط أعلى صحيحًا أو اترك الحقل فارغًا.');return;}
    // Preserve the value around the existing calculator by temporarily attaching it to the form data.
    oldCalculateAreaHydraulicForm(e,areaId);
    const a=getArea(areaId);if(!a?.hydraulicDesign?.result)return;
    const r=a.hydraulicDesign.result;a.hydraulicDesign.inputs.maxPressureAtLowPointM=limit;
    const low=Number.isFinite(Number(a.lowestElevationM))?Number(a.lowestElevationM):null;
    const sourceHGL=num(a.hydraulicDesign.inputs.sourceElevationM)+num(a.hydraulicDesign.inputs.sourcePressureM)+num(r.pumpHeadRequiredM);
    // Conservative upper-bound estimate at the low point: ignores friction along that low route.
    r.lowPointPressureUpperBoundM=low===null?null:Math.max(0,sourceHGL-low);
    r.pressureSafetyChecked=limit!==null;
    r.maximumPermittedPressureAtLowPointM=limit;
    r.pressureSafe=limit!==null&&r.lowPointPressureUpperBoundM!==null&&r.lowPointPressureUpperBoundM<=limit;
    r.pipeCriteriaFeasible=!!r.feasible;
    r.overallFeasible=r.pipeCriteriaFeasible&&r.pressureSafetyChecked&&r.pressureSafe;
    r.feasible=r.overallFeasible;
    saveState();
    const out=document.getElementById('areaHydraulicResults');if(out)out.innerHTML=renderAreaHydraulicResultHtml(a.hydraulicDesign.inputs,r);
  };
  const oldRenderAreaHydraulicResultHtml=renderAreaHydraulicResultHtml;
  renderAreaHydraulicResultHtml=function(i,r){
    let html=oldRenderAreaHydraulicResultHtml(i,r);
    const statusText=r.pressureSafetyChecked?(r.pressureSafe?'فحص الضغط الأقصى عند أدنى نقطة: ضمن الحد المدخل':'تحذير: الضغط التقديري عند أدنى نقطة يتجاوز الحد المدخل'):'فحص الضغط الأقصى غير مكتمل: أدخل الحد المسموح وفق تصنيف الأنبوب والكود المحلي.';
    const statusClass=r.pressureSafetyChecked?(r.pressureSafe?'good':'warn'):'warn';
    const detail=r.lowPointPressureUpperBoundM==null?'منسوب أدنى نقطة غير مسجل.':`الضغط الأعلى التقديري عند أدنى نقطة (تقدير محافظ قبل احتساب فقد مسارها): ${fmt(r.lowPointPressureUpperBoundM,2)} م عمود ماء${r.maximumPermittedPressureAtLowPointM==null?'':` · الحد المدخل ${fmt(r.maximumPermittedPressureAtLowPointM,2)} م`}.`;
    const box=`<div class="notice ${statusClass}" style="margin-top:10px"><strong>${statusText}</strong><div>${detail} إذا تجاوز الضغط الحد، يجب دراسة تقسيم مناطق الضغط أو صمام تخفيض ضغط/خزان وسيط، ولا يعتمد التصميم كما هو.</div></div>`;
    return html.replace('</section>',box+'</section>');
  };

  // Update area demand hint based on household quota model where household records exist.
  const oldOpenAreaHydraulicModalForDemand=oldOpenAreaHydraulicModal;
  // The pop-demand field is explicitly an estimate, not a final demand, because registration may be incomplete.
  // Add the actual total quota as a visible secondary reference after the modal is built.
  const prevOpenAreaForQuota=openAreaHydraulicModal;
  openAreaHydraulicModal=function(areaId){
    prevOpenAreaForQuota(areaId);
    const a=getArea(areaId);const linked=activeHouseholds().filter(h=>h.areaId===areaId);
    const registeredDaily=linked.reduce((s,h)=>s+weeklyQuota(h),0)/7;
    const form=document.getElementById('areaHydraulicForm');
    if(form&&linked.length){const note=document.createElement('div');note.className='notice info';note.textContent=`الطلب اليومي المحسوب للأسر المسجلة في هذه المنطقة وفق الحصتين الفردية والمنزلية: ${fmtLitres(registeredDaily)}. إذا لم تكن جميع الأسر مسجلة، استخدم إجمالي الطلب المعتمد للمنطقة بدل هذا المجموع الجزئي.`;form.insertBefore(note,form.firstChild.nextSibling);}
  };

  // Patch the old settings screen with explicit editable split assumptions.
  const previousRenderSettings=renderSettings;
  renderSettings=function(){
    previousRenderSettings();
    const legacy=document.querySelector('#settingsForm input[name="litresPerPersonDay"]');
    if(legacy){const fld=legacy.closest('.field');if(fld)fld.style.display='none';}
    const s=state.settings;
    const section=`<section class="card" style="margin-top:16px"><div class="section-title"><div><h3>تقسيم الحصة: فردية + منزلية مشتركة</h3><p>قيم نموذجية تجريبية قابلة للتعديل وليست معيارًا صحيًا أو مائيًا عامًا.</p></div></div><form id="quotaSplitForm"><div class="field-grid"><div class="field"><label>حصة الفرد اليومية (لتر/شخص/يوم)</label><input type="number" name="personalLitresPerPersonDay" min="0" max="300" step="0.5" value="${s.personalLitresPerPersonDay}"></div><div class="field"><label>الاستخدام المنزلي المشترك المرتبط بعدد السكان (لتر/شخص/يوم)</label><input type="number" name="sharedHouseholdLitresPerPersonDay" min="0" max="300" step="0.5" value="${s.sharedHouseholdLitresPerPersonDay}"></div><div class="field"><label>معدل التنظيف حسب المساحة (لتر/م²/يوم)</label><input type="number" name="cleaningLitresPerM2Day" min="0" max="10" step="0.001" value="${s.cleaningLitresPerM2Day}"></div><div class="field"><label>المساحة المرجعية عند عدم إدخال مساحة (م²/شخص)</label><input type="number" name="referenceAreaM2PerPerson" min="1" max="300" step="1" value="${s.referenceAreaM2PerPerson}"></div></div><div class="notice info">الحصة الفردية تشمل الشرب والنظافة الشخصية والاستحمام. الحصة المنزلية تشمل الطبخ والسيفون والغسيل والتنظيف غير الشخصي. المعادلة: أفراد × (حصة الفرد + الاستخدام المشترك للفرد) + مساحة المسكن × معدل التنظيف. عند عدم تسجيل المساحة يستخدم النظام المساحة المرجعية المؤقتة. في القيم الافتراضية، أسرة من 5 أفراد ومساحتها 150 م² تعطي 45 لترًا للفرد يوميًا كمرجع تجريبي.</div><div class="form-actions"><button class="btn primary">حفظ التقسيم وإعادة الجدولة</button></div></form></section>`;
    document.getElementById('content').insertAdjacentHTML('beforeend',section);
    document.getElementById('quotaSplitForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget);const p=num(f.get('personalLitresPerPersonDay'),-1),sh=num(f.get('sharedHouseholdLitresPerPersonDay'),-1),ar=num(f.get('cleaningLitresPerM2Day'),-1),ref=num(f.get('referenceAreaM2PerPerson'),-1);if([p,sh,ar,ref].some(x=>!Number.isFinite(x)||x<0)||ref<=0){toast('تحقق من قيم تقسيم الحصة.');return}Object.assign(state.settings,{personalLitresPerPersonDay:p,sharedHouseholdLitresPerPersonDay:sh,cleaningLitresPerM2Day:ar,referenceAreaM2PerPerson:ref});state.schedule=buildScheduleFor(state.households,state.settings,state.settings.weekStart);state.meta.lastScheduleBuild=new Date().toISOString();saveState();renderAll();toast('تم حفظ تقسيم الحصة وإعادة حساب الجدول.');});
  };

  // Preserve quota status on manual household edits and make area assignment editable.
  const prevSaveHouseForm=saveHouseForm;
  saveHouseForm=function(e){
    e.preventDefault();const f=new FormData(e.currentTarget),id=String(f.get('id')||'');
    if(!id){prevSaveHouseForm({preventDefault(){},currentTarget:e.currentTarget});ensureInstrumentation(state);saveState();renderAll();return;}
    const h=getHouse(id);if(!h){toast('لم يتم العثور على الوحدة.');return;}
    const areaId=String(f.get('areaId')||'');
    if(areaId&&!getArea(areaId)){toast('اختر منطقة مسجلة أو اتركها دون ربط.');return;}
    const members=Math.max(1,Math.min(100,Math.round(num(f.get('members'),5)))),area=num(f.get('houseAreaM2'),0),floors=Math.round(num(f.get('floors'),1));
    if(!(area>=1&&area<=50000)||!(floors>=1&&floors<=100)){toast('تحقق من مساحة المسكن وعدد الطوابق.');return;}
    Object.assign(h,{name:String(f.get('name')).trim(),members,houseAreaM2:area,floors,areaId,housingType:f.get('housingType'),zone:Math.max(1,Math.min(state.settings.zoneCount,Number(f.get('zone')))),building:String(f.get('building')||'').trim(),unit:String(f.get('unit')||'').trim(),serviceLength:Math.max(0,num(f.get('serviceLength'),20))});
    ensureInstrumentation(state);closeModal();state.schedule=buildScheduleFor(state.households,state.settings,state.settings.weekStart);saveState();renderAll();toast('تم حفظ بيانات الوحدة وتحديث الحصة والجدولة.');
  };

  // Area profiles and building profiles are isolated in device IDs; refresh inventory.
  ensureInstrumentation(state);
  state.schedule=buildScheduleFor(state.households,state.settings,state.settings.weekStart);
  saveState();
})();


// Separate administrator accounts (local prototype only).
const _renderSettingsWithAdminAccounts=renderSettings;
renderSettings=function(){
  _renderSettingsWithAdminAccounts();
  if(!adminUnlocked)return;
  const rows=(state.adminUsers||[]).map(u=>`<tr><td>${esc(u.displayName||u.username)}</td><td dir="ltr">${esc(u.username)}</td><td>${u.active!==false?'<span class="pill green">نشط</span>':'<span class="pill gray">موقوف</span>'}</td><td><div class="toolbar"><button class="btn small" type="button" onclick="toggleAdminUser('${esc(u.id)}')">${u.active!==false?'إيقاف':'تفعيل'}</button>${u.id!==currentAdminUser?.id?`<button class="btn small danger" type="button" onclick="deleteAdminUser('${esc(u.id)}')">حذف</button>`:''}</div></td></tr>`).join('');
  document.getElementById('content').insertAdjacentHTML('beforeend',`<section class="card" style="margin-top:16px"><div class="section-title"><div><h3>حسابات المسؤولين</h3><p>إنشاء حساب مستقل لكل مسؤول. لا تشاركوا بيانات الدخول.</p></div></div><div class="notice warn"><span>⚠</span><div>الحسابات محفوظة محليًا في هذا المتصفح فقط. لن تنتقل تلقائيًا إلى أجهزة المسؤولين الآخرين، ويمكن تجاوزها تقنيًا لأنها ليست حماية خادمية.</div></div><form id="newAdminUserForm"><div class="field-grid"><div class="field"><label>اسم المسؤول</label><input name="displayName" required maxlength="60"></div><div class="field"><label>اسم المستخدم</label><input name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]+"></div><div class="field"><label>كلمة المرور (10 أحرف على الأقل)</label><input type="password" name="password" required minlength="10" autocomplete="new-password"></div></div><div class="form-actions"><button class="btn primary">إضافة حساب مسؤول</button></div></form><div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="empty">لا توجد حسابات.</td></tr>'}</tbody></table></div></section>`);
  document.getElementById('newAdminUserForm').addEventListener('submit',createAdminUser);
};
async function createAdminUser(e){e.preventDefault();const f=new FormData(e.currentTarget),displayName=String(f.get('displayName')||'').trim(),username=String(f.get('username')||'').trim().toLowerCase(),password=String(f.get('password')||'');if(!/^[a-z0-9._-]{3,32}$/.test(username)){toast('اسم المستخدم غير صالح.');return;}if(password.length<10){toast('كلمة المرور يجب ألا تقل عن 10 أحرف.');return;}if(state.adminUsers.some(u=>u.username.toLowerCase()===username)){toast('اسم المستخدم مستخدم بالفعل.');return;}const salt=randomSalt(),hash=await passwordDigest(password,salt);state.adminUsers.push({id:'ADM-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),username,displayName:displayName||username,salt,hash,active:true,createdAt:new Date().toISOString()});saveState();renderAll();toast('تمت إضافة حساب المسؤول.');}
function toggleAdminUser(id){const u=state.adminUsers.find(x=>x.id===id);if(!u)return;if(u.id===currentAdminUser?.id&&u.active!==false){toast('لا يمكنك إيقاف الحساب الذي تستخدمه الآن.');return;}u.active=u.active===false;saveState();renderAll();toast(u.active?'تم تفعيل الحساب.':'تم إيقاف الحساب.');}
function deleteAdminUser(id){if(state.adminUsers.length<=1){toast('يجب الاحتفاظ بحساب مسؤول واحد على الأقل.');return;}if(id===currentAdminUser?.id){toast('لا يمكنك حذف الحساب الذي تستخدمه الآن.');return;}const u=state.adminUsers.find(x=>x.id===id);if(!u||!confirm(`حذف حساب ${u.displayName||u.username}؟`))return;state.adminUsers=state.adminUsers.filter(x=>x.id!==id);saveState();renderAll();toast('تم حذف الحساب.');}

// Navigation and application events
document.querySelectorAll('#adminNav button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
document.getElementById('roleSelect').disabled=true; // لا يوجد تبديل أدوار من واجهة المستخدم
document.getElementById('familyLogout').addEventListener('click',familyLogout);
document.getElementById('adminLogout').addEventListener('click',adminLogout);
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop'&&!(PORTAL_MODE==='admin'&&!adminUnlocked))closeModal()});
window.addEventListener('resize',()=>{if(currentRole==='admin'&&currentView==='dashboard')drawChart('weeklyChart',dayTotals())});
// Distinct portals: the family portal never exposes administrator navigation; the admin portal always requires its own password gate.
if(PORTAL_MODE==='admin'){
  document.body.classList.add('portal-admin','admin-login-lock');
  document.getElementById('portalBadge').textContent='بوابة المسؤول';
  const av=document.querySelector('.top-actions .avatar');if(av)av.textContent='م';
  currentRole='admin';adminUnlocked=false;familySessionId=null;
  saveState();renderAll();openAdminAuthModal(state.adminUsers&&state.adminUsers.length?'login':'setup');
}else{
  document.body.classList.add('portal-family');
  document.getElementById('portalBadge').textContent='بوابة الأسرة';
  currentRole='family';adminUnlocked=false;familySessionId=null;
  saveState();renderAll();
}
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY){state=loadState();renderAll();}});
</script>
</body>
